<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E2333"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E2CE"/>
      <stop offset="50%" stop-color="#E8C4A0"/>
      <stop offset="100%" stop-color="#B89368"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0E8B8"/>
      <stop offset="100%" stop-color="#2D4A3E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#E8C4A0" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Subtle glow halo -->
  <circle cx="256" cy="240" r="160" fill="url(#goldGrad)" opacity="0.08"/>

  <!-- Stylized Open Book Graphic -->
  <g filter="url(#glow)">
    <!-- Left Page -->
    <path d="M 120 180 C 180 160, 240 185, 256 200 L 256 360 C 240 345, 180 325, 120 345 Z" fill="url(#goldGrad)"/>
    <!-- Right Page -->
    <path d="M 392 180 C 332 160, 272 185, 256 200 L 256 360 C 272 345, 332 325, 392 345 Z" fill="url(#goldGrad)"/>
    <!-- Center Spine & Bookmark Ribbon -->
    <path d="M 256 160 L 256 380" stroke="#0A0B0E" stroke-width="8" stroke-linecap="round"/>
    <path d="M 256 160 Q 270 210 285 240 L 275 245 L 256 210 Z" fill="url(#emeraldGrad)"/>
  </g>

  <!-- Sparkle stars -->
  <path d="M 370 120 Q 380 135 395 145 Q 380 155 370 170 Q 360 155 345 145 Q 360 135 370 120 Z" fill="#F7E2CE"/>
  <path d="M 140 140 Q 148 150 160 156 Q 148 162 140 172 Q 132 162 120 156 Q 132 150 140 140 Z" fill="#A0E8B8"/>
</svg>
